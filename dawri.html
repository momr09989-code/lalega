<script>
/**
 * Deterministic round-robin scheduling and standings, independent of the UI.
 * Each round uses the circle method. A cyclic orientation keeps each player's
 * first-leg home/away counts within one match; leg two reverses every fixture.
 */

function validatePlayers(players) {
  if (!Array.isArray(players) || players.length < 2 || players.length > 32) {
    throw new RangeError('A league needs between 2 and 32 players.');
  }
  const ids = new Set();
  for (const player of players) {
    if (!player || typeof player.id !== 'string' || !player.id.trim() || ids.has(player.id)) {
      throw new TypeError('Every player must have a unique, non-empty string ID.');
    }
    ids.add(player.id);
  }
}

/** @param {{id:string,name:string}[]} players */
function generateSchedule(players, doubleLeg = true) {
  validatePlayers(players);
  const count = players.length;
  // Put the first two players at opposite ends to seed the opening match.
  const rotation = [0, ...Array.from({ length: count - 2 }, (_, i) => i + 2)];
  if (count % 2) rotation.push(null);
  rotation.push(1);

  // Odd cyclic tournaments have equal in/out degree. For an even player
  // count, remove one vertex from the next odd tournament: degrees differ by 1.
  const orientationSize = count % 2 ? count : count + 1;
  const homeRadius = (orientationSize - 1) / 2;
  const rounds = [];
  const roundCount = rotation.length - 1;

  for (let index = 0; index < roundCount; index += 1) {
    const number = index + 1;
    const matches = [];
    let byeId = null;
    for (let pair = 0; pair < rotation.length / 2; pair += 1) {
      const left = rotation[pair];
      const right = rotation[rotation.length - 1 - pair];
      if (left === null || right === null) {
        byeId = players[left === null ? right : left].id;
        continue;
      }
      const leftIsHome = (right - left + orientationSize) % orientationSize <= homeRadius;
      matches.push({
        id: `r${number}-m${matches.length + 1}`,
        homeId: players[leftIsHome ? left : right].id,
        awayId: players[leftIsHome ? right : left].id,
      });
    }
    rounds.push({ id: number, leg: 1, number, matches, byeId });
    rotation.splice(1, 0, rotation.pop());
  }

  if (doubleLeg) {
    const firstLeg = rounds.slice();
    for (const round of firstLeg) {
      const number = round.number + roundCount;
      rounds.push({
        id: number,
        leg: 2,
        number,
        matches: round.matches.map((match, index) => ({
          id: `r${number}-m${index + 1}`,
          homeId: match.awayId,
          awayId: match.homeId,
        })),
        byeId: round.byeId,
      });
    }
  }

  return rounds;
}

/** A result is complete only when both scores are actual integers in range. */
function isValidResult(result) {
  return !!result && Number.isInteger(result.home) && Number.isInteger(result.away)
    && result.home >= 0 && result.home <= 99 && result.away >= 0 && result.away <= 99;
}

/**
 * Recompute from saved results so edits and removals never accumulate points.
 * Ties use points, goal difference, goals scored, then initial player order.
 */
function calculateStandings(players, rounds, results = {}) {
  validatePlayers(players);
  const rows = players.map((player) => ({
    id: player.id, name: player.name,
    played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, gd: 0, points: 0,
  }));
  const byId = new Map(rows.map((row) => [row.id, row]));
  const order = new Map(players.map((player, index) => [player.id, index]));
  const counted = new Set();

  for (const round of rounds) {
    for (const match of round.matches) {
      const result = results?.[match.id];
      if (!isValidResult(result) || counted.has(match.id)) continue;
      const home = byId.get(match.homeId);
      const away = byId.get(match.awayId);
      if (!home || !away || home === away) continue;
      counted.add(match.id);
      home.played += 1;
      away.played += 1;
      home.gf += result.home;
      home.ga += result.away;
      away.gf += result.away;
      away.ga += result.home;
      if (result.home === result.away) {
        home.drawn += 1;
        away.drawn += 1;
        home.points += 1;
        away.points += 1;
      } else {
        const winner = result.home > result.away ? home : away;
        const loser = result.home > result.away ? away : home;
        winner.won += 1;
        winner.points += 3;
        loser.lost += 1;
      }
    }
  }

  for (const row of rows) row.gd = row.gf - row.ga;
  rows.sort((a, b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf || order.get(a.id) - order.get(b.id));
  return rows.map((row, index) => ({ ...row, position: index + 1 }));
}

const svg = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.ball}</svg>`;
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName = name => name.normalize('NFKC').trim().replace(/\s+/g,' ');
const palette = [ ['#293821','#4d6436','#c3e29f'], ['#2b303b','#48566c','#aebed6'], ['#3a3025','#63513c','#d9ba92'], ['#302b3b','#534565','#c3b0d7'], ['#213a33','#376456','#9fd4c1'], ['#3b2d2d','#654343','#d9aaaa'], ['#343923','#5e663c','#d0d9a4'] ];
let storageAvailable = true;
let restoredError = false;
let league = restore();
let setupOpen = !league;
let draft = {count:7, names:[...seeds], doubleLeg:true};
let tab = league?.tab || 'rounds';
let timer;

function restore() {
  let saved;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch { storageAvailable = false; return null; }
  if (!saved) return null;
  try {
    const value = JSON.parse(saved);
    if (value.version !== 1 || !Array.isArray(value.players) || typeof value.doubleLeg !== 'boolean') throw Error();
    const players = value.players.map((p,i) => {
      if (p.id !== `p${i+1}` || typeof p.name !== 'string' || !cleanName(p.name) || p.name.length > 30) throw Error();
      return {id:p.id,name:cleanName(p.name)};
    });
    if (new Set(players.map(p => p.name.toLocaleLowerCase('ar'))).size !== players.length) throw Error();
    const rounds = generateSchedule(players,value.doubleLeg);
    const results = {};
    for (const match of rounds.flatMap(r=>r.matches)) if (isValidResult(value.results?.[match.id])) results[match.id] = value.results[match.id];
    return {players,rounds,results,doubleLeg:value.doubleLeg,roundIndex:Math.max(0,Math.min(rounds.length-1,Number.isInteger(value.roundIndex)?value.roundIndex:0)),tab:['rounds','standings','players'].includes(value.tab)?value.tab:'rounds'};
  } catch { restoredError = true; return null; }
}

function persist() {
  if (!league) return;
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,players:league.players,doubleLeg:league.doubleLeg,results:league.results,roundIndex:league.roundIndex,tab}));
    storageAvailable=true;
  } catch {storageAvailable=false;}
}

function player(id) { return league.players.find(p=>p.id===id); }
function avatar(p,index) {
  const i = index ?? (league?.players.findIndex(item=>item.id===p.id) ?? 0);
  const c=palette[Math.max(0,i)%palette.length];
  return `<span class="avatar" aria-hidden="true" style="--av-bg:${c[0]};--av-line:${c[1]};--av-fg:${c[2]}">${esc(Array.from(p.name)[0]?.toLocaleUpperCase() || '?')}</span>`;
}
function totalMatches(){return league.rounds.reduce((n,r)=>n+r.matches.length,0);}
function playedMatches(){return Object.values(league.results).filter(isValidResult).length;}

  bindEvents();

}

function setupMarkup() {

      <p class="form-note">${svg('info')}الأسماء المعروضة مثال جاهز للتجربة. عدّلها بأسماء أصحابك.</p>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="create-footer"><p>كل لاعب يقابل باقي اللاعبين<br>${draft.doubleLeg?'مرتين، مع تبديل الأرض.':'مرة واحدة خلال الدوري.'}</p><button class="primary" type="submit">إنشاء الدوري ${svg('arrow')}</button></div>
    </form></section>
    <aside class="setup-aside" aria-label="ملخص الدوري"><section class="card pitch-card"><div class="pitch-eyebrow"><span>اللعبة أحلى مع بعض</span><span dir="ltr">FC / FRIENDS</span></div><h2>لمّة صحاب.<br><em>منافسة أبطال.</em></h2><p>كل المواجهات في مكان واحد.<br>مين هيكون صاحب آخر كلمة؟</p><div class="pitch" aria-hidden="true"><i class="box"></i><i class="box right"></i><span class="pitch-player p1">O</span><span class="pitch-player p2">H</span></div><div class="pitch-lineup"><span>صافرة البداية</span><b dir="ltr">${esc(draft.names[0]||'اللاعب 1')} <span style="color:#788b66;margin:0 5px">vs</span> ${esc(draft.names[1]||'اللاعب 2')}</b></div></section>
    <section class="card expect-card"><h3>دوريك في سطور</h3><div class="expect-row"><span>اللاعبون</span><strong>${draft.count}</strong></div><div class="expect-row"><span>الجولات</span><strong>${rounds}</strong></div><div class="expect-row"><span>المباريات</span><strong>${games}</strong></div><p class="expect-foot">${svg('shield')}${draft.count%2?'لاعب راحة كل جولة، بالتساوي بين الجميع.':'كل اللاعبين يشاركوا في كل جولة.'}</p></section></aside>
  </div>`;
}

function dashboardMarkup() {
  const done=playedMatches(),total=totalMatches();
  const title={rounds:'كل جولة، حكاية جديدة.',standings:'العين على الصدارة.',players:'أصحاب برّه. منافسين جوّه.'}[tab];
  const description={rounds:'الجدول جاهز. اختار الجولة وسجّل نتيجة كل مواجهة.',standings:'كل هدف يفرق. الترتيب بيتحدّث مع كل نتيجة.',players:'المنافسون اللي هيكتبوا حكاية الدوري.'}[tab];
  return `<div class="page-heading"><div><p class="eyebrow"><span></span>دوري الأصحاب · ${league.doubleLeg?'ذهاب وعودة':'ذهاب فقط'}</p><h1>${title}</h1><p class="subtext">${description}</p></div><button class="secondary" data-action="new-league">${svg('plus')}دوري جديد</button></div>
    <div class="stats">
      ${statCard('اللاعبون',league.players.length,'users')}
      ${statCard('إجمالي الجولات',league.rounds.length,'calendar')}
      ${statCard('المباريات',total,'ball')}
      ${statCard('المباريات المكتملة',`${done} <small>/ ${total}</small>`,'check',true)}
    </div>
    ${tab==='rounds'?`<div class="dashboard-grid">${fixturesMarkup()}<aside class="left-stack">${standingsMarkup(false)}${progressMarkup()}</aside></div>`:tab==='standings'?standingsMarkup(true):playersMarkup()}`;
}
function statCard(label,value,icon,lime=false){return `<section class="card stat ${lime?'lime':''}" aria-label="${label}"><div><p class="stat-label">${label}</p><div class="stat-value">${value}</div></div><div class="stat-icon">${svg(icon)}</div></section>`;}
function fixturesMarkup() {
  const round=league.rounds[league.roundIndex];
  const completed=round.matches.filter(m=>isValidResult(league.results[m.id])).length;
  return `<section class="card fixtures-card" aria-label="جدول المباريات"><div class="card-head"><div class="round-heading"><h2>الجولة ${round.number}</h2><span class="badge">${round.leg===1?'الذهاب':'العودة'}</span></div><div class="round-controls"><button class="icon-button" data-step="-1" aria-label="الجولة السابقة" ${league.roundIndex===0?'disabled':''}>${svg('right')}</button><button class="icon-button" data-step="1" aria-label="الجولة التالية" ${league.roundIndex===league.rounds.length-1?'disabled':''}>${svg('left')}</button></div></div>
  <nav class="round-strip" aria-label="اختيار الجولة">${league.rounds.map((r,i)=>`<button class="round-chip ${i===league.roundIndex?'selected':''} ${r.matches.every(m=>isValidResult(league.results[m.id]))?'done':''}" data-round="${i}" ${i===league.roundIndex?'aria-current="true"':''} aria-label="الجولة ${r.number}، ${r.leg===1?'الذهاب':'العودة'}">${r.number}</button>`).join('')}</nav>
  <div class="fixtures">${round.matches.map(m=>matchMarkup(m)).join('')}</div>
  ${round.byeId?`<div class="bye">${svg('coffee')}<span><bdi><b>${esc(player(round.byeId).name)}</b></bdi> في راحة</span><span>راجع الجولة الجاية</span></div>`:''}
  <div class="fixtures-footer"><span>${svg('check')}${completed} من ${round.matches.length} مباريات مكتملة</span><span class="fixture-tip">اضغط على المواجهة لتسجيل النتيجة</span></div></section>`;
}
function matchMarkup(match) {
  const home=player(match.homeId),away=player(match.awayId),result=league.results[match.id],played=isValidResult(result);
  return `<button class="match ${played?'played':''}" data-match="${match.id}" aria-label="${played?'تعديل':'تسجيل'} نتيجة ${esc(home.name)} ضد ${esc(away.name)}${played?`، ${result.home} مقابل ${result.away}`:''}">
    <span class="match-player">${avatar(home)}<span><bdi class="player-name">${esc(home.name)}</bdi><span class="team-type">صاحب الأرض</span></span></span>
    <span class="match-middle"><span class="score-box ${played?'':'empty'}">${played?`<span>${result.home}</span><span class="dash">:</span><span>${result.away}</span>`:'VS'}</span><span class="match-action">${played?'انتهت · تعديل':'تسجيل النتيجة'}</span></span>
    <span class="match-player away">${avatar(away)}<span><bdi class="player-name">${esc(away.name)}</bdi><span class="team-type">الضيف</span></span></span>
  </button>`;
}
function standingsMarkup(full) {
  const rows=calculateStandings(league.players,league.rounds,league.results);
  const shown=full?rows:rows.slice(0,7);
  const hasResults=playedMatches()>0;
  return `<section class="card standings-card ${full?'full-standings':''}" aria-label="جدول الترتيب"><div class="card-head"><div class="card-title">${svg('chart')}<h2>جدول الترتيب</h2></div>${!full?`<button data-tab="standings">كامل ${svg('left')}</button>`:'<small>يتحدّث تلقائيًا</small>'}</div><div class="table-scroll" ${full?'tabindex="0" role="region" aria-label="جدول الترتيب الكامل، اسحب أفقيًا لعرض الأعمدة"':''}><table class="standings-table"><thead><tr><th scope="col">#</th><th scope="col" class="player-cell">اللاعب</th><th scope="col">لعب</th>${full?'<th scope="col">فاز</th><th scope="col">تعادل</th><th scope="col">خسر</th><th scope="col">له</th><th scope="col">عليه</th>':''}<th scope="col"><abbr title="فارق الأهداف" style="text-decoration:none">+/−</abbr></th><th scope="col">نقاط</th></tr></thead><tbody>${shown.map((p,i)=>`<tr class="${i===0&&hasResults?'leader':''}"><td>${p.position.toString().padStart(2,'0')}</td><td class="player-cell"><span class="table-player">${avatar(p)}<bdi>${esc(p.name)}</bdi></span></td><td>${p.played}</td>${full?`<td>${p.won}</td><td>${p.drawn}</td><td>${p.lost}</td><td>${p.gf}</td><td>${p.ga}</td>`:''}<td><bdi>${p.gd>0?'+':''}${p.gd}</bdi></td><td class="points">${p.points}</td></tr>`).join('')}</tbody></table></div>
  ${full?'<div class="rules"><span>الفوز<b>3 نقاط</b></span><span>التعادل<b>نقطة</b></span><span>الخسارة<b>0</b></span></div><p class="standings-caption">الترتيب: النقاط، ثم فارق الأهداف، ثم الأهداف المسجلة. عند التساوي الكامل يُستخدم ترتيب إدخال الأسماء.</p>':`<p class="standings-caption">${hasResults?'الفوز 3 نقاط · التعادل نقطة · الخسارة 0':'الصافرة لسه ما بدأتش. الصدارة مستنية صاحبها.'}${rows.length>7?' · أول 7 لاعبين':''}</p>`}</section>`;
}
function progressMarkup(){const done=playedMatches(),total=totalMatches(),pct=Math.round(done/total*100);return `<section class="card progress-card"><div class="progress-top"><span>مشوار البطولة</span><strong>${pct}%</strong></div><div class="progress-bar" role="progressbar" aria-label="المباريات المكتملة" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${total}" aria-valuetext="${done} من ${total} مباراة"><span style="width:${pct}%"></span></div><p>${done===total?'الدوري اكتمل! شوف الترتيب النهائي واحتفلوا بالبطل.':done===0?'أول نتيجة هي أول خطوة في مشوار اللقب.':`فاضل ${total-done} مباراة، والمنافسة مستمرة.`}</p></section>`;}
function playersMarkup(){const rows=calculateStandings(league.players,league.rounds,league.results);return `<div class="players-grid">${league.players.map(p=>{const row=rows.find(r=>r.id===p.id);return `<article class="card player-card">${avatar(p)}<div><bdi>${esc(p.name)}</bdi><p>${row.played} مباراة · ${row.points} نقطة</p></div></article>`;}).join('')}</div><p class="subtext" style="margin-top:20px">لتغيير المشاركين أو نظام المنافسة، ابدأ دوري جديد.</p>`;}

function bindEvents() {
  document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{tab=button.dataset.tab;setupOpen=false;persist();render();});
  document.querySelectorAll('[data-action]').forEach(button=>button.onclick=event=>{
    event.preventDefault();
    const action=button.dataset.action;
    if(action==='home'||action==='cancel-setup'){setupOpen=!league;tab='rounds';render();}
    if(action==='new-league'){draft={count:league.players.length,names:league.players.map(p=>p.name),doubleLeg:league.doubleLeg};setupOpen=true;render();window.scrollTo({top:0});}
    if(action==='example'){draft={count:7,names:[...seeds],doubleLeg:draft.doubleLeg};render();toast('أسماء المثال جاهزة. اضغط إنشاء الدوري.');}
  });
  if(setupOpen){
    document.querySelectorAll('[data-player-index]').forEach(input=>input.oninput=()=>{draft.names[Number(input.dataset.playerIndex)]=input.value;input.removeAttribute('aria-invalid');document.querySelector('#form-error').textContent='';});
    document.querySelectorAll('[data-count]').forEach(button=>button.onclick=()=>updateCount(Math.min(32,Math.max(2,draft.count+Number(button.dataset.count)))));
    document.querySelector('#player-count').oninput=event=>{
      const n=Number(event.target.value);
      if(Number.isInteger(n)&&n>=2&&n<=32)updateCount(n);
    };
    document.querySelector('#player-count').onchange=event=>{
      const n=Number(event.target.value);
      if(!Number.isInteger(n)||n<2||n>32){event.target.setAttribute('aria-invalid','true');document.querySelector('#form-error').textContent='اختار عدد صحيح من 2 إلى 32 لاعب.';return;}
      updateCount(n);
    };
    document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{draft.doubleLeg=button.dataset.mode==='double';render();});
    document.querySelector('#setup-form').onsubmit=event=>{event.preventDefault();createLeague();};
  } else {
    document.querySelectorAll('[data-round]').forEach(button=>button.onclick=()=>selectRound(Number(button.dataset.round)));
    document.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>selectRound(league.roundIndex+Number(button.dataset.step)));
    document.querySelectorAll('[data-match]').forEach(button=>button.onclick=()=>openScore(button.dataset.match));
  }
}

function selectRound(index){league.roundIndex=Math.max(0,Math.min(league.rounds.length-1,index));persist();render();document.querySelector('.round-chip.selected')?.focus({preventScroll:true});}
function updateCount(count){
  draft.count=count;
  const field=document.querySelector('#player-count');
  field.value=count;field.removeAttribute('aria-invalid');
  document.querySelector('#form-error').textContent='';
  document.querySelector('[data-count="-1"]').disabled=count===2;
  document.querySelector('[data-count="1"]').disabled=count===32;
  const group=document.querySelector('.player-inputs');
  while(group.children.length>count)group.lastElementChild.remove();
  while(group.children.length<count){
    const i=group.children.length;
    const label=document.createElement('label');label.className='player-input';
    label.innerHTML=`<span class="number" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><input type="text" name="player-${i+1}" data-player-index="${i}" aria-label="اسم اللاعب ${i+1}" value="${esc(draft.names[i]||'')}" maxlength="30" placeholder="اسم اللاعب ${i+1}" autocomplete="off" dir="auto" required>`;
    const input=label.querySelector('input');
    input.oninput=()=>{draft.names[i]=input.value;input.removeAttribute('aria-invalid');document.querySelector('#form-error').textContent='';};
    group.append(label);
  }
  const values=[count,(count%2?count:count-1)*(draft.doubleLeg?2:1),count*(count-1)*(draft.doubleLeg?1:.5)];
  document.querySelectorAll('.expect-row strong').forEach((el,i)=>el.textContent=values[i]);
  document.querySelector('.expect-foot').innerHTML=svg('shield')+(count%2?'لاعب راحة كل جولة، بالتساوي بين الجميع.':'كل اللاعبين يشاركوا في كل جولة.');
}
function createLeague(){
  const error=document.querySelector('#form-error');
  const count=Number(document.querySelector('#player-count').value);
  if(!Number.isInteger(count)||count<2||count>32){error.textContent='اختار عدد صحيح من 2 إلى 32 لاعب.';document.querySelector('#player-count').focus();return;}
  if(count!==draft.count)updateCount(count);
  const names=draft.names.slice(0,draft.count).map(n=>cleanName(n||''));
  while(names.length<draft.count)names.push('');
  const invalid=names.findIndex(n=>!n||n.length>30);
  if(invalid!==-1){error.textContent='اكتب اسم لكل لاعب، بحد أقصى 30 حرف.';const field=document.querySelector(`[data-player-index="${invalid}"]`);field.setAttribute('aria-invalid','true');field.focus();return;}
  const seen=new Set();let duplicate=-1;
  names.forEach((n,i)=>{const key=n.toLocaleLowerCase('ar');if(seen.has(key))duplicate=i;seen.add(key);});
  if(duplicate!==-1){error.textContent='في اسم مكرر. ميّز كل لاعب باسم مختلف.';const field=document.querySelector(`[data-player-index="${duplicate}"]`);field.setAttribute('aria-invalid','true');field.focus();return;}
  const commit=()=>{
    const players=names.map((name,i)=>({id:`p${i+1}`,name}));
    league={players,rounds:generateSchedule(players,draft.doubleLeg),doubleLeg:draft.doubleLeg,results:{},roundIndex:0};tab='rounds';setupOpen=false;persist();render();window.scrollTo({top:0});toast(storageAvailable?'الدوري جاهز. يلا نبدأ المنافسة!':'الدوري جاهز، لكن الحفظ على الجهاز غير متاح.');
  };
  if(league){confirmAction('نبدأ دوري جديد؟','الدوري الحالي ونتائجه هيتبدّلوا بالدوري الجديد. تقدر ترجع وتكمل الدوري الحالي قبل الإنشاء.','إنشاء دوري جديد',commit);}else commit();
}
function confirmAction(title,copy,label,action){
  const dialog=document.querySelector('#confirm-dialog');
  dialog.innerHTML=`<h2 id="confirm-title">${title}</h2><p class="confirm-copy">${copy}</p><div class="dialog-actions"><button class="secondary" data-cancel>إلغاء</button><button class="primary" data-confirm>${label}</button></div>`;
  dialog.querySelector('[data-cancel]').onclick=()=>dialog.close();
  dialog.querySelector('[data-confirm]').onclick=()=>{dialog.close();action();};
  dialog.showModal();
}
function openScore(id){
  const match=league.rounds.flatMap(r=>r.matches).find(m=>m.id===id);
  const home=player(match.homeId),away=player(match.awayId),result=league.results[id];
  const dialog=document.querySelector('#score-dialog');
  dialog.innerHTML=`<form id="score-form" novalidate><div class="dialog-head"><h2 id="score-title">${result?'تعديل النتيجة':'صافرة النهاية'}</h2><button type="button" class="text-button" aria-label="إغلاق" data-close>${svg('close')}</button></div><p class="dialog-sub">سجّل الأهداف، والترتيب علينا.</p><div class="score-inputs"><div class="score-person">${avatar(home)}<label for="home-score"><bdi>${esc(home.name)}</bdi></label><input id="home-score" type="number" inputmode="numeric" min="0" max="99" step="1" placeholder="—" value="${result?.home??''}" required aria-describedby="score-error" aria-label="أهداف ${esc(home.name)}"></div><span class="score-separator">:</span><div class="score-person">${avatar(away)}<label for="away-score"><bdi>${esc(away.name)}</bdi></label><input id="away-score" type="number" inputmode="numeric" min="0" max="99" step="1" placeholder="—" value="${result?.away??''}" required aria-describedby="score-error" aria-label="أهداف ${esc(away.name)}"></div></div><p class="form-error" id="score-error" role="alert"></p><div class="dialog-actions">${result?'<button class="text-button danger-button" type="button" data-clear>مسح النتيجة</button>':'<button class="text-button" type="button" data-close>إلغاء</button>'}<button class="primary" type="submit">${svg('check')}حفظ النتيجة</button></div></form>`;
  dialog.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dialog.close());
  dialog.querySelector('[data-clear]')?.addEventListener('click',()=>{delete league.results[id];dialog.close();persist();render();toast('اتمسحت النتيجة واتحدّث الترتيب.');});
  dialog.querySelector('form').onsubmit=event=>{
    event.preventDefault();
    const h=dialog.querySelector('#home-score'),a=dialog.querySelector('#away-score');
    const score={home:Number(h.value),away:Number(a.value)};
    if(h.value.trim()===''||a.value.trim()===''||!isValidResult(score)){
      dialog.querySelector('#score-error').textContent='اكتب نتيجة كاملة: عدد صحيح من 0 إلى 99 لكل لاعب.';
      (h.value.trim()===''||!Number.isInteger(score.home)||score.home<0||score.home>99?h:a).focus();return;
    }
    league.results[id]=score;dialog.close();persist();render();toast(storageAvailable?'اتحفظت النتيجة واتحدّث الترتيب.':'اتحدّث الترتيب، لكن الحفظ على الجهاز غير متاح.');
  };
  dialog.showModal();
  dialog.querySelector('#home-score').focus();
}

render();
if(restoredError)toast('تعذّر قراءة الدوري المحفوظ. أنشئ دوري جديد.');

</script>
</body>
</html>
